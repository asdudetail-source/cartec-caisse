<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse & Stock Cartec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Formulaire d'ajout rapide -->
        <section class="form-section">
            <h2>+ Ajouter un produit</h2>
            <form id="form-produit" onsubmit="ajouterProduitManuel(event)">
                <input type="text" id="add-ref" placeholder="Référence (ex: 12122/5)" required>
                <input type="text" id="add-nom" placeholder="Nom du produit" required>
                <input type="number" id="add-stock" placeholder="Stock initial" min="0" required>
                <input type="number" step="0.01" id="add-pa" placeholder="Prix d'achat Net (€)" required>
                <button type="submit" class="btn-ajouter">+ Enregistrer le produit</button>
            </form>
        </section>

        <!-- Catalogue -->
        <section class="catalogue-section">
            <h2>Catalogue Produits</h2>
            <input type="text" id="search-bar" placeholder="Rechercher..." oninput="filtrerProduits()">
            
            <div class="options-vente">
                <label>Client :
                    <select id="select-client" onchange="rafraichirTicket()">
                        <option value="particulier">Particulier</option>
                        <option value="pro">Professionnel</option>
                    </select>
                </label>
                <label>Canal :
                    <select id="select-canal" onchange="rafraichirTicket()">
                        <option value="facture">Facturé</option>
                        <option value="black">Black</option>
                    </select>
                </label>
            </div>

            <div id="produits-grid" class="grid"></div>
        </section>

        <!-- Ticket de caisse -->
        <section class="ticket-section">
            <h2>Ticket en cours</h2>
            <div id="ticket-items"></div>
            
            <div class="total-box">
                <span>TOTAL À PAYER</span>
                <h1 id="total-amount">0.00 €</h1>
            </div>

            <button class="btn-valider" onclick="validerVente()">Valider la vente & Déstocker</button>
            <button class="btn-reset" onclick="reinitialiserTout()">Vider la base de données</button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
