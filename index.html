<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse & Stock Cartec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Section 1 : Ajout de produit -->
        <section class="card-section">
            <h2>+ Nouveau Produit</h2>
            <form id="form-produit">
                <input type="text" id="add-nom" placeholder="Nom du produit" required>
                <input type="number" id="add-stock" placeholder="Stock dispo" min="0" required>
                <input type="number" step="0.01" id="add-pro" placeholder="Prix pro (€)" required>
                <input type="number" step="0.01" id="add-part" placeholder="Prix particulier (€)" required>
                <button type="submit" class="btn-ajouter">Ajouter au catalogue</button>
            </form>
        </section>

        <!-- Section 2 : Catalogue des produits -->
        <section class="card-section">
            <h2>Catalogue</h2>
            <input type="text" id="search-bar" placeholder="Rechercher un article...">
            
            <div class="options-vente">
                <select id="select-client">
                    <option value="particulier">Tarif Particulier</option>
                    <option value="pro">Tarif Professionnel</option>
                </select>
                <select id="select-canal">
                    <option value="facture">Canal Facturé</option>
                    <option value="black">Canal Cash / Black</option>
                </select>
            </div>

            <div id="produits-grid" class="grid"></div>
        </section>

        <!-- Section 3 : Ticket de caisse & Historique -->
        <section class="card-section">
            <h2>Ticket en cours</h2>
            <div id="ticket-items" class="ticket-list"></div>
            
            <div class="total-box">
                <small>TOTAL TICKET</small>
                <h1 id="total-amount">0.00 €</h1>
            </div>

            <button id="btn-valider" class="btn-valider">Valider la vente</button>

            <hr class="separator">

            <h2>Dernières Ventes</h2>
            <div id="historique-ventes" class="ventes-list"></div>

            <hr class="separator">

            <h2>Espace Représentant</h2>
            <button id="btn-export" class="btn-export">Copier le bilan (Stock & Ventes)</button>
            <button id="btn-reset" class="btn-reset">Vider catalogue et ventes</button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
