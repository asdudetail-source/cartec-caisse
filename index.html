<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse & Stock - L'As Du Détail</title>
    
    <!-- SDK Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f4f5f7;
            --header-bg: #111111;
            --card-bg: #ffffff;
            --accent-blue: #007aff;
            --accent-red: #ff3b30;
            --border-color: #e5e5ea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: #1c1c1e;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        header h1 { margin: 0 0 15px 0; font-size: 20px; }
        
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .tab-btn {
            background: #2c2c2e;
            color: #8e8e93;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .caisse-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .caisse-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-red { background: var(--accent-red); margin-top: 8px; }

        .ticket-items {
            min-height: 150px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .ticket-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .total-price {
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #666;
        }
        .search-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .search-item:hover { background-color: #f0f0f5; }
    </style>
</head>
<body>

    <header>
        <h1>Caisse & Stock - L'As Du Détail</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('caisse')">Caisse / Vente</button>
            <button class="tab-btn" onclick="switchTab('stock')">Gestion Stock</button>
            <button class="tab-btn" onclick="switchTab('historique')">Historique Ventes</button>
        </div>
    </header>

    <div class="container">
        
        <!-- ONGLET 1: CAISSE / VENTE -->
        <div id="tab-caisse" class="tab-content active">
            <div class="caisse-grid">
                <div class="card">
                    <div class="caisse-controls">
                        <select id="tarifSelect" onchange="actualiserPanierUI()">
                            <option value="particulier">Tarif Particulier</option>
                            <option value="pro">Tarif Professionnel</option>
                        </select>
                        <select id="canalSelect">
                            <option value="atelier">Vente Atelier</option>
                            <option value="drive">Enlèvement / Drive</option>
                        </select>
                    </div>
                    <div>
                        <input type="text" id="searchArticle" placeholder="Rechercher un article..." oninput="rechercherArticle()">
                        <div id="searchResults" style="margin-top: 10px;"></div>
                    </div>
                </div>

                <div class="card">
                    <h2>Ticket de caisse</h2>
                    <div class="ticket-items" id="ticketItems">
                        <p style="color: #8e8e93; text-align: center;">Panier vide</p>
                    </div>
                    <div class="total-price">Total : <span id="totalMontant">0.00</span> €</div>
                    <button class="btn" onclick="validerVente()">Valider la vente</button>
                    <button class="btn btn-red" onclick="viderPanier()">Vider le panier</button>
                </div>
            </div>
        </div>

        <!-- ONGLET 2: GESTION STOCK -->
        <div id="tab-stock" class="tab-content">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <h2>+ Ajouter / Modifier un produit</h2>
                <form id="formProduit" onsubmit="enregistrerProduit(event)">
                    <div class="form-group">
                        <label>NOM DU PRODUIT</label>
                        <input type="text" id="nomProduit" placeholder="Ex: Green Star 1L" required>
                    </div>
                    <div class="form-group">
                        <label>MARQUE / GROUPE</label>
                        <input type="text" id="marqueProduit" placeholder="Ex: Koch-Chemie" required>
                    </div>
                    <div class="form-group">
                        <label>CATÉGORIE</label>
                        <input type="text" id="categorieProduit" placeholder="Ex: Nettoyant Polyvalent" required>
                    </div>
                    <div class="form-group">
                        <label>STOCK DISPONIBLE</label>
                        <input type="number" id="stockProduit" value="0" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>PRIX ACHAT (€)</label>
                        <input type="number" step="0.01" id="prixAchat" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>PRIX PARTICULIER (€)</label>
                        <input type="number" step="0.01" id="prixParticulier" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>PRIX PROFESSIONNEL (€)</label>
                        <input type="number" step="0.01" id="prixPro" placeholder="0.00" required>
                    </div>
                    <button type="submit" class="btn" style="background: #ff9500;">+ Enregistrer le produit</button>
                </form>
            </div>
        </div>

        <!-- ONGLET 3: HISTORIQUE VENTES -->
        <div id="tab-historique" class="tab-content">
            <div class="card">
                <h2>Historique des Ventes</h2>
                <div id="historiqueListe">
                    <p style="color: #8e8e93;">Chargement des ventes...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURATION FIREBASE EXACTE DE VOTRE PROJET
        const firebaseConfig = {
            apiKey: "AIzaSyBXpSlIjZh39Kdrxxd1a6vH30kJk-WSt44",
            authDomain: "cartec-caisse.firebaseapp.com",
            databaseURL: "https://cartec-caisse-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cartec-caisse",
            storageBucket: "cartec-caisse.appspot.com",
            messagingSenderId: "802357519611",
            appId: "1:802357519611:web:61016c2ccaa629bb4efc5e"
        };

        // Initialisation Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let produits = [];
        let ventes = [];
        let panier = [];

        // Écoute en temps réel du stock Firebase
        db.ref('stock').on('value', snapshot => {
            const data = snapshot.val();
            produits = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
        });

        // Écoute en temps réel des ventes Firebase
        db.ref('ventes').on('value', snapshot => {
            const data = snapshot.val();
            ventes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            afficherHistorique();
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // Enregistrement d'un produit vers Firebase
        function enregistrerProduit(e) {
            e.preventDefault();
            
            const prodId = 'PROD_' + Date.now();
            const nouveauProduit = {
                nom: document.getElementById('nomProduit').value,
                marque: document.getElementById('marqueProduit').value,
                categorie: document.getElementById('categorieProduit').value,
                stock: parseInt(document.getElementById('stockProduit').value),
                prixAchat: parseFloat(document.getElementById('prixAchat').value),
                prixParticulier: parseFloat(document.getElementById('prixParticulier').value),
                prixPro: parseFloat(document.getElementById('prixPro').value)
            };

            db.ref('stock/' + prodId).set(nouveauProduit)
                .then(() => {
                    document.getElementById('formProduit').reset();
                    alert('Produit enregistré avec succès et synchronisé !');
                })
                .catch(err => alert('Erreur : ' + err.message));
        }

        // Recherche d'article
        function rechercherArticle() {
            const query = document.getElementById('searchArticle').value.toLowerCase();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (query.trim() === '') return;

            const matches = produits.filter(p => 
                (p.nom && p.nom.toLowerCase().includes(query)) || 
                (p.marque && p.marque.toLowerCase().includes(query))
            );

            matches.forEach(p => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `<strong>${p.nom}</strong> (${p.marque}) - Stock: <strong>${p.stock}</strong>`;
                item.onclick = () => ajouterAuPanier(p);
                resultsContainer.appendChild(item);
            });
        }

        function ajouterAuPanier(produit) {
            const ex = panier.find(item => item.id === produit.id);
            if (ex) {
                if (ex.qte < produit.stock) ex.qte++;
                else alert('Stock insuffisant !');
            } else {
                if (produit.stock > 0) panier.push({ ...produit, qte: 1 });
                else alert('Produit en rupture de stock !');
            }
            actualiserPanierUI();
        }

        function actualiserPanierUI() {
            const typeTarif = document.getElementById('tarifSelect').value;
            const container = document.getElementById('ticketItems');
            container.innerHTML = '';
            let total = 0;

            panier.forEach(item => {
                const prix = typeTarif === 'pro' ? item.prixPro : item.prixParticulier;
                const ligneTotal = prix * item.qte;
                total += ligneTotal;

                container.innerHTML += `
                    <div class="ticket-row">
                        <span>${item.nom} (x${item.qte})</span>
                        <span>${ligneTotal.toFixed(2)} €</span>
                    </div>
                `;
            });

            document.getElementById('totalMontant').innerText = total.toFixed(2);
        }

        function viderPanier() {
            panier = [];
            actualiserPanierUI();
        }

        // Validation de la vente avec déduction automatique du stock en temps réel
        function validerVente() {
            if (panier.length === 0) return alert('Le panier est vide.');

            const typeTarif = document.getElementById('tarifSelect').value;
            let totalVente = 0;

            panier.forEach(item => {
                const nouveauStock = item.stock - item.qte;
                db.ref('stock/' + item.id + '/stock').set(nouveauStock);
                totalVente += (typeTarif === 'pro' ? item.prixPro : item.prixParticulier) * item.qte;
            });

            const venteId = 'VENTE_' + Date.now();
            db.ref('ventes/' + venteId).set({
                date: new Date().toLocaleString(),
                total: totalVente,
                articles: panier
            }).then(() => {
                viderPanier();
                document.getElementById('searchArticle').value = '';
                document.getElementById('searchResults').innerHTML = '';
                alert('Vente validée et stock mis à jour sur tous vos appareils !');
            });
        }

        function afficherHistorique() {
            const container = document.getElementById('historiqueListe');
            if (ventes.length === 0) {
                container.innerHTML = '<p style="color: #8e8e93;">Aucune vente enregistrée.</p>';
                return;
            }

            container.innerHTML = ventes.map(v => `
                <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
                    <strong>Vente du ${v.date}</strong><br>
                    Total : <strong>${v.total ? v.total.toFixed(2) : 0} €</strong>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
