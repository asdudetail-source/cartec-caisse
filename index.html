<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caisse & Stock Cartec</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cartec Caisse">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Caisse &amp; Stock Cartec</h1>
        <nav>
            <button id="tab-caisse" class="active" onclick="switchTab('caisse')">Caisse / Vente</button>
            <button id="tab-stock" onclick="switchTab('stock')">Gestion Stock</button>
            <button id="tab-historique" onclick="switchTab('historique')">Historique Ventes</button>
        </nav>
    </header>

    <main>
        <!-- SECTION CAISSE -->
        <section id="section-caisse" class="tab-content active">
            <div class="caisse-container">
                <div class="catalog-panel">
                    <h2>Catalogue</h2>
                    
                    <div class="options-vente">
                        <select id="select-client" onchange="renderProducts()">
                            <option value="particulier">Tarif Particulier</option>
                            <option value="pro">Tarif Professionnel</option>
                        </select>
                        <select id="select-canal">
                            <option value="facture">Canal Facturé</option>
                            <option value="black">Canal Cash / Black</option>
                        </select>
                    </div>

                    <input type="text" id="search-bar" placeholder="🔍 Rechercher un article..." oninput="renderProducts()">

                    <div id="product-grid" class="product-grid"></div>
                </div>

                <div class="cart-panel">
                    <h2>Ticket de caisse</h2>
                    <ul id="cart-list" class="cart-list"></ul>
                    <div class="cart-summary">
                        <div class="total-row">
                            <span>Total :</span>
                            <span id="cart-total">0.00 €</span>
                        </div>
                        <button class="btn-primary" onclick="checkout()">Valider la vente</button>
                        <button class="btn-danger" onclick="clearCart()">Vider le panier</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION GESTION DU STOCK -->
        <section id="section-stock" class="tab-content">
            <h2>Inventaire &amp; Ajout Produits</h2>
            <form id="add-product-form" onsubmit="handleAddProduct(event)">
                <h3 id="form-title">+ Ajouter un produit</h3>
                <div class="form-group">
                    <input type="text" id="prod-name" placeholder="Nom du produit" required>
                    <input type="number" id="prod-stock" placeholder="Stock dispo" min="0" required>
                    <input type="number" id="prod-price-pro" placeholder="Prix Pro (€)" step="0.01" required>
                    <input type="number" id="prod-price-part" placeholder="Prix Particulier (€)" step="0.01" required>
                    <button type="submit" id="submit-btn" class="btn-success">Enregistrer produit</button>
                    <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display: none;" onclick="cancelEdit()">Annuler</button>
                </div>
            </form>

            <!-- BARRE DE RECHERCHE DANS LE STOCK -->
            <input type="text" id="search-stock-bar" placeholder="🔍 Rechercher un produit à modifier ou consulter..." oninput="renderStockTable()">

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nom du produit</th>
                        <th>Prix Part.</th>
                        <th>Prix Pro</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="stock-table-body"></tbody>
            </table>
        </section>

        <!-- SECTION HISTORIQUE -->
        <section id="section-historique" class="tab-content">
            <h2>Historique des Ventes</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Date &amp; Heure</th>
                        <th>Canal</th>
                        <th>Tarif</th>
                        <th>Détail des articles</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="history-table-body"></tbody>
            </table>

            <div class="rep-actions">
                <button class="btn-export" onclick="exportData()">Copier le bilan (Stock &amp; Ventes)</button>
                <button class="btn-reset" onclick="resetAll()">Vider catalogue et ventes</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
