<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse & Gestion Stock Cartec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Formulaire d'ajout -->
        <section class="card-section form-section">
            <h2>+ Nouveau Produit</h2>
            <form id="form-produit" onsubmit="ajouterProduitManuel(event)">
                <input type="text" id="add-nom" placeholder="Nom du produit" required>
                <input type="number" id="add-stock" placeholder="Stock disponible" min="0" required>
                <input type="number" step="0.01" id="add-pro" placeholder="Prix Pro HT / Net (€)" required>
                <input type="number" step="0.01" id="add-part" placeholder="Prix Particulier TTC (€)" required>
                <button type="submit" class="btn-ajouter">Ajouter au catalogue</button>
            </form>
        </section>

        <!-- Catalogue Produits -->
        <section class="card-section catalogue-section">
            <h2>Catalogue</h2>
            <input type="text" id="search-bar" placeholder="Rechercher un article..." oninput="filtrerProduits()">
            
            <div class="options-vente">
                <select id="select-client" onchange="rafraichirTout()">
                    <option value="particulier">Client Particulier</option>
                    <option value="pro">Client Professionnel</option>
                </select>
                <select id="select-canal" onchange="rafraichirTout()">
                    <option value="facture">Canal Facturé</option>
                    <option value="black">Canal Black</option>
                </select>
            </div>

            <div id="produits-grid" class="grid"></div>
        </section>

        <!-- Ticket & Export Représentant -->
        <section class="card-section ticket-section">
            <h2>Ticket en cours</h2>
            <div id="ticket-items" class="ticket-list"></div>
            
            <div class="total-box">
                <small>TOTAL</small>
                <h1 id="total-amount">0.00 €</h1>
            </div>

            <button class="btn-valider" onclick="validerVente()">Valider la vente</button>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e5ea;">

            <h2>Espace Représentant</h2>
            <button class="btn-export" onclick="exporterStockRepresentant()">Copier le bilan de stock</button>
            <button class="btn-reset" onclick="reinitialiserTout()">Vider complètement le catalogue</button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
