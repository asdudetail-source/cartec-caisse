<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion Stock & Caisse - L'As Du Détail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>L'As Du Détail — Caisse</h1>
        <button id="btn-ouvrir-modal" class="btn-primary">+ Produit</button>
    </header>

    <main class="app-container">
        <!-- Section Filtres & Recherche -->
        <section class="controls-section">
            <input type="text" id="search-bar" placeholder="Rechercher un produit..." autocomplete="off">
            
            <div class="select-group">
                <div class="select-box">
                    <label for="select-client">Tarif :</label>
                    <select id="select-client">
                        <option value="particulier">Particulier</option>
                        <option value="pro">Professionnel</option>
                    </select>
                </div>
                
                <div class="select-box">
                    <label for="select-canal">Canal :</label>
                    <select id="select-canal">
                        <option value="black">Cash / Black</option>
                        <option value="facture">Facturé</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Grille du Catalogue Produit -->
        <section class="catalogue-section">
            <h2>Catalogue <small>(Appui long pour gérer le stock/supprimer)</small></h2>
            <div id="produits-grid" class="produits-grid">
                <!-- Les cartes produits s'affichent ici -->
            </div>
        </section>

        <!-- Panneau Ticket en cours & Actions -->
        <section class="ticket-section">
            <h2>Ticket en cours</h2>
            <div id="ticket-items" class="ticket-items">
                <!-- Les articles ajoutés s'affichent ici -->
            </div>
            
            <div class="ticket-total">
                <span>Total :</span>
                <span id="total-amount">0.00 €</span>
            </div>

            <button id="btn-valider" class="btn-success btn-block">Valider la vente</button>
        </section>

        <!-- Historique des ventes -->
        <section class="historique-section">
            <h2>Historique des ventes</h2>
            <div id="historique-ventes" class="historique-list">
                <!-- L'historique s'affiche ici -->
            </div>
        </section>

        <!-- Actions de gestion globale -->
        <section class="global-actions">
            <button id="btn-export" class="btn-secondary btn-block">📊 Copier le Bilan & Stock</button>
            <button id="btn-reset" class="btn-danger btn-block">⚠️ Réinitialiser l'application</button>
        </section>
    </main>

    <!-- Modal d'ajout de produit -->
    <div id="modal-produit" class="modal">
        <div class="modal-content">
            <h3>Ajouter un nouvel article</h3>
            <form id="form-produit">
                <div class="form-group">
                    <label for="add-nom">Nom de l'article *</label>
                    <input type="text" id="add-nom" required placeholder="Ex: Magic Wheel Cleaner">
                </div>

                <div class="form-group">
                    <label for="add-stock">Stock initial</label>
                    <input type="number" id="add-stock" placeholder="0" min="0" onfocus="this.select()">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="add-part">Prix Particulier (€)</label>
                        <input type="number" id="add-part" step="0.01" placeholder="0.00" min="0" onfocus="this.select()">
                    </div>
                    <div class="form-group">
                        <label for="add-pro">Prix Pro (€)</label>
                        <input type="number" id="add-pro" step="0.01" placeholder="0.00" min="0" onfocus="this.select()">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-success" style="flex: 1;">Enregistrer</button>
                    <button type="button" id="btn-fermer-modal" class="btn-secondary">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
