<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse & Stock Cartec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Section Catalogue -->
        <section class="catalogue-section">
            <h2>Produits Cartec</h2>
            <input type="text" id="search-bar" placeholder="Rechercher un produit..." oninput="filtrerProduits()">
            
            <div class="options-vente">
                <label>Client :
                    <select id="select-client" onchange="rafraichirTicket()">
                        <option value="particulier">Particulier</option>
                        <option value="pro">Professionnel</option>
                    </select>
                </label>
                <label>Canal :
                    <select id="select-canal" onchange="rafraichirTicket()">
                        <option value="facture">Facturé</option>
                        <option value="black">Black</option>
                    </select>
                </label>
            </div>

            <div id="produits-grid" class="grid"></div>
        </section>

        <!-- Section Ticket de Caisse -->
        <section class="ticket-section">
            <h2>Ticket en cours</h2>
            <div id="ticket-items"></div>
            
            <div class="total-box">
                <span>TOTAL À PAYER</span>
                <h1 id="total-amount">0.00 €</h1>
            </div>

            <button class="btn-valider" onclick="validerVente()">Valider la vente & Déstocker</button>
            <button class="btn-export" onclick="exporterStockCSV()">Exporter Stock Mis à Jour (CSV)</button>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
